<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='account.css'">
<head th:replace="~{layout/header :: head('Điểm Thưởng')}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="account-page">
  <div class="container">
    <div class="account-layout">
      <div th:replace="~{account/fragments :: sidebar(active=${accountMenu})}"></div>

      <div>
        <div class="account-card points-hero">
          <div>
            <h3 class="account-title mb-1">Điểm Thưởng</h3>
            <p class="text-muted small mb-0">1 điểm = 1đ khi thanh toán. Điểm không có hạn sử dụng.</p>
          </div>
          <div class="points-balance">
            <span class="points-balance-number" th:text="${#numbers.formatDecimal(pointBalance, 1, 'POINT', 0, 'COMMA')}">0</span>
            <span class="points-balance-label">điểm</span>
          </div>
        </div>

        <div class="account-card">
          <h2 class="h6">Cách kiếm điểm</h2>
          <ul class="mb-0">
            <li>Hoàn thành 1 đơn hàng: cộng <strong>1 điểm / 1.000đ</strong> giá trị đơn.</li>
            <li>Đánh giá 1 sản phẩm đã mua: cộng <strong>200 điểm</strong>.</li>
          </ul>
        </div>

        <div class="account-card">
          <h2 class="h6">Lịch sử điểm</h2>
          <div th:if="${#lists.isEmpty(pointHistory)}" class="text-muted">Bạn chưa có giao dịch điểm nào.</div>
          <table class="table mb-0" th:if="${!#lists.isEmpty(pointHistory)}">
            <thead>
              <tr>
                <th>Thời gian</th>
                <th>Nội dung</th>
                <th class="text-end">Điểm</th>
                <th class="text-end">Số dư sau</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="t : ${pointHistory}">
                <td th:text="${t.createdAt != null ? #temporals.format(t.createdAt, 'dd/MM/yyyy HH:mm') : ''}">--</td>
                <td th:text="${t.description}">Mô tả</td>
                <td class="text-end fw-bold"
                    th:classappend="${t.points > 0} ? ' text-success' : ' text-danger'"
                    th:text="${t.points > 0 ? '+' : ''} + ${t.points}">+0</td>
                <td class="text-end" th:text="${t.balanceAfter}">0</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
