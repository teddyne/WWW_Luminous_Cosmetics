<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='product.css'">
<head th:replace="~{layout/header :: head('Sản phẩm')}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="container product-page">
  <!-- 1 form GET duy nhat cho ca o tim kiem + bo loc: submit la URL giu
       nguyen trang thai loc, F5 hay copy link deu ra cung ket qua.
       Select/radio/checkbox tu submit khi doi; o gia thi bam "Ap dung". -->
  <form method="get" th:action="@{/products}">
    <div class="shop-search-wrap">
      <div class="shop-search">
        <input type="text" name="q" th:value="${q}" placeholder="Tìm kiếm sản phẩm, thương hiệu..."
               aria-label="Tìm kiếm sản phẩm"/>
        <button type="submit" aria-label="Tìm kiếm"><i class="bi bi-search"></i></button>
      </div>
    </div>

    <!-- Thong bao khi vao trang bang ten danh muc chua co trong DB mau
         (VD tu menu: Makeup, Duong moi) — hien toan bo san pham that. -->
    <div class="shop-notice" th:if="${notice != null}" th:text="${notice}"></div>

    <div class="shop-layout">
      <!-- Cot loc ben trai. -->
      <aside class="filter-sidebar">
        <section class="filter-section">
          <h3>Thương hiệu</h3>
          <select name="brand" class="form-select" onchange="this.form.submit()" aria-label="Lọc theo thương hiệu">
            <option value="">Tất cả thương hiệu</option>
            <option th:each="b : ${brands}" th:value="${b}" th:text="${b}"
                    th:selected="${b == brand}"></option>
          </select>
        </section>

        <section class="filter-section">
          <h3>Loại sản phẩm</h3>
          <label class="filter-check" th:each="cat : ${categories}">
            <input type="checkbox" name="categoryId" th:value="${cat.id}"
                   th:checked="${categoryId != null and categoryId.contains(cat.id)}"
                   onchange="this.form.submit()"/>
            <span th:text="${cat.name}"></span>
          </label>
        </section>

        <section class="filter-section">
          <h3>Khoảng giá</h3>
          <div class="price-range">
            <input type="number" name="minPrice" th:value="${minPrice}" placeholder="Từ" min="0"
                   aria-label="Giá thấp nhất"/>
            <span>-</span>
            <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="Đến" min="0"
                   aria-label="Giá cao nhất"/>
          </div>
          <button type="submit" class="btn-apply">Áp dụng</button>
        </section>

        <section class="filter-section">
          <h3>Sắp xếp theo</h3>
          <label class="filter-radio">
            <input type="radio" name="sort" value="price_asc"
                   th:checked="${sort == 'price_asc'}" onchange="this.form.submit()"/>
            <span>Giá từ thấp đến cao</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="sort" value="price_desc"
                   th:checked="${sort == 'price_desc'}" onchange="this.form.submit()"/>
            <span>Giá từ cao đến thấp</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="sort" value="best"
                   th:checked="${sort == 'best'}" onchange="this.form.submit()"/>
            <span>Sản phẩm bán chạy nhất</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="sort" value="newest"
                   th:checked="${sort == 'newest'}" onchange="this.form.submit()"/>
            <span>Sản phẩm mới nhất</span>
          </label>
        </section>

        <section class="filter-section">
          <h3>Đánh giá</h3>
          <label class="filter-radio">
            <input type="radio" name="minRating" value="5"
                   th:checked="${minRating == '5'}" onchange="this.form.submit()"/>
            <span><span class="stars-gold">★★★★★</span> trở lên</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="minRating" value="4"
                   th:checked="${minRating == '4'}" onchange="this.form.submit()"/>
            <span><span class="stars-gold">★★★★</span><span class="stars-empty">★</span> trở lên</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="minRating" value="3"
                   th:checked="${minRating == '3'}" onchange="this.form.submit()"/>
            <span><span class="stars-gold">★★★</span><span class="stars-empty">★★</span> trở lên</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="minRating" value="2"
                   th:checked="${minRating == '2'}" onchange="this.form.submit()"/>
            <span><span class="stars-gold">★★</span><span class="stars-empty">★★★</span> trở lên</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="minRating" value="1"
                   th:checked="${minRating == '1'}" onchange="this.form.submit()"/>
            <span><span class="stars-gold">★</span><span class="stars-empty">★★★★</span> trở lên</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="minRating" value=""
                   th:checked="${minRating == null or minRating == ''}" onchange="this.form.submit()"/>
            <span>Tất cả đánh giá</span>
          </label>
        </section>

        <a class="clear-filters" th:href="@{/products}">Xóa bộ lọc</a>
      </aside>

      <!-- Luoi san pham ben phai. -->
      <section class="shop-results">
        <p class="result-count" th:text="'Tìm thấy ' + ${totalItems} + ' sản phẩm'"></p>

        <div class="shop-grid" th:if="${!products.isEmpty()}">
          <article class="shop-card" th:each="card : ${products}">
            <!-- Anh + ten dan sang trang chi tiet (buoc tiep theo trong luong). -->
            <a class="shop-card-img" th:href="@{/products/{id}(id=${card.product.id})}">
              <img th:src="${card.imageUrl}" th:alt="${card.name()}" loading="lazy"/>
            </a>
            <div class="shop-card-body">
              <div class="shop-brand" th:text="${card.brand()}"></div>
              <div class="shop-price" th:text="${card.priceRangeText()}"></div>
              <a class="shop-name" th:href="@{/products/{id}(id=${card.product.id})}"
                 th:text="${card.name()}"></a>
              <div class="shop-rating">
                <span th:if="${card.reviewCount > 0}">
                  <span class="rating-number"
                        th:text="${#numbers.formatDecimal(card.rating, 1, 1)}"></span>
                  <span class="stars-gold">★</span>
                  <span class="text-muted small"
                        th:text="'(' + ${#numbers.formatInteger(card.reviewCount, 1, 'POINT')} + ' đánh giá)'"></span>
                </span>
                <span th:if="${card.reviewCount == 0}" class="text-muted small">Chưa có đánh giá</span>
              </div>
              <form th:action="@{/cart/add}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="variantId" th:value="${card.variant.id}"/>
                <input type="hidden" name="quantity" value="1"/>
                <button type="submit" class="btn-add" title="Thêm vào giỏ hàng" aria-label="Thêm vào giỏ hàng">
                  <i class="bi bi-cart-plus"></i>
                </button>
              </form>
            </div>
          </article>
        </div>

        <!-- Phan trang: moi link giu nguyen bo loc hien tai (tu khoa, hang, danh muc, gia, sao, sap xep, khuyen mai). -->
        <nav class="shop-pagination" th:if="${totalPages > 1}" aria-label="Phân trang sản phẩm">
          <a class="page-link" th:if="${currentPage > 1}"
             th:href="@{/products(page=${currentPage - 1}, q=${q}, brand=${brand}, categoryId=${categoryId}, categoryName=${categoryName}, minPrice=${minPrice}, maxPrice=${maxPrice}, minRating=${minRating}, sort=${sort}, onSale=${onSale})}">«</a>
          <span class="page-link page-link-disabled" th:unless="${currentPage > 1}">«</span>
          <th:block th:each="p : ${#numbers.sequence(pageWindowStart, pageWindowEnd)}">
            <a class="page-link" th:if="${p != currentPage}"
               th:href="@{/products(page=${p}, q=${q}, brand=${brand}, categoryId=${categoryId}, categoryName=${categoryName}, minPrice=${minPrice}, maxPrice=${maxPrice}, minRating=${minRating}, sort=${sort}, onSale=${onSale})}"
               th:text="${p}">1</a>
            <span class="page-link page-link-current" th:if="${p == currentPage}" aria-current="page" th:text="${p}">1</span>
          </th:block>
          <a class="page-link" th:if="${currentPage < totalPages}"
             th:href="@{/products(page=${currentPage + 1}, q=${q}, brand=${brand}, categoryId=${categoryId}, categoryName=${categoryName}, minPrice=${minPrice}, maxPrice=${maxPrice}, minRating=${minRating}, sort=${sort}, onSale=${onSale})}">»</a>
          <span class="page-link page-link-disabled" th:unless="${currentPage < totalPages}">»</span>
        </nav>

        <!-- Khong co du lieu thi hien thong bao, khong gia vo co hang. -->
        <div class="empty-state" th:if="${products.isEmpty()}">
          <p>Không tìm thấy sản phẩm phù hợp với bộ lọc.</p>
          <a th:href="@{/products}">Xóa bộ lọc và xem tất cả sản phẩm</a>
        </div>
      </section>
    </div>
  </form>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
