<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='account.css'">
<head th:replace="~{layout/header :: head('Yêu cầu trả hàng')}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="account-page">
  <div class="container">
    <div class="account-layout">
      <div th:replace="~{account/fragments :: sidebar(active=${accountMenu})}"></div>

      <div>
        <div class="account-card">
          <h1 class="account-title">Yêu cầu trả hàng / hoàn tiền</h1>
          <p class="text-muted small mb-3">
            Đơn <strong th:text="${order.orderCode}">DH000001</strong> ·
            Thành tiền <strong th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'POINT', 0, 'COMMA')} + 'đ'">0đ</strong> ·
            Hạn trả hàng <strong th:text="${#temporals.format(reviewDeadline, 'dd/MM/yyyy')}">--/--/----</strong>
            (3 ngày sau khi giao).
          </p>

          <div class="order-line" th:each="line : ${lines}">
            <img th:src="${line.imageUrl()}" th:alt="${line.productName()}" loading="lazy"/>
            <div class="order-line-info">
              <strong th:text="${line.productName()}">Tên sản phẩm</strong>
              <span class="text-muted small" th:text="${line.variantLabel()}">Phân loại</span>
            </div>
            <div class="order-line-price">
              <div th:text="${line.unitPriceText()}">0đ</div>
              <div class="text-muted small" th:text="'x' + ${line.quantity()}">x1</div>
              <div class="fw-bold" th:text="${line.totalPriceText()}">0đ</div>
            </div>
          </div>

          <form th:action="@{/account/orders/{id}/return(id=${order.id})}" method="post"
                th:object="${returnForm}" class="mt-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
              <label class="form-label fw-bold" for="reason">Lý do trả hàng</label>
              <select class="form-select" id="reason" th:field="*{reason}">
                <option value="">-- Chọn lý do --</option>
                <option th:each="r : ${returnReasons}" th:value="${r}" th:text="${r}">Lý do</option>
              </select>
              <div class="text-danger small mt-1" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold" for="refundMethod">Hình thức hoàn tiền</label>
              <select class="form-select" id="refundMethod" th:field="*{refundMethod}">
                <option th:each="m : ${refundMethods}" th:value="${m.value()}" th:text="${m.label()}">Hoàn tiền</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold" for="note">Ghi chú thêm</label>
              <textarea class="form-control" id="note" rows="3" th:field="*{note}"
                        placeholder="Mô tả tình trạng sản phẩm, địa chỉ shop nhận lại hàng..."></textarea>
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-lum" type="submit">Gửi yêu cầu trả hàng</button>
              <a th:href="@{/account/orders}" class="btn btn-outline-secondary">Quay lại đơn mua</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
