<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='auth.css'">
<head th:replace="~{layout/header :: head('Đăng ký tài khoản')}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="auth-page">
  <div class="container" style="max-width:620px">
    <div class="auth-card">
      <a th:href="@{/}" class="btn-close-card" title="Đóng" aria-label="Đóng">✕</a>
      <h1 class="text-center fw-bold" style="font-size:22px">Đăng ký tài khoản</h1>
      <p class="text-center text-muted" style="font-size:13px">Đăng nhập/Đăng ký để nhận các ưu đãi cho các đơn hàng bạn nhé</p>

      <div th:if="${registerError}" class="alert alert-danger" th:text="${registerError}">Lỗi đăng ký</div>

      <form th:action="@{/register}" th:object="${form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
          <input class="form-control form-control-lg" type="text" th:field="*{identifier}" placeholder="Nhập email hoặc số điện thoại" aria-label="Email hoặc số điện thoại"/>
          <div class="text-danger small" th:if="${#fields.hasErrors('identifier')}" th:errors="*{identifier}"></div>
        </div>
        <div class="mb-3 position-relative">
          <input id="registerPassword" class="form-control form-control-lg pe-5" type="password" th:field="*{password}" placeholder="Nhập mật khẩu" aria-label="Mật khẩu"/>
          <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted"
                  onclick="togglePassword('registerPassword', this)" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button>
          <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
          <div class="form-text">Mật khẩu ít nhất 8 ký tự, sẽ được mã hóa BCrypt trước khi lưu.</div>
        </div>
        <div class="mb-3">
          <input class="form-control form-control-lg" type="text" th:field="*{fullName}" placeholder="Họ và tên" aria-label="Họ và tên"/>
          <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <!-- Captcha: 60% o nhap + 40% anh + nut refresh -->
        <div class="mb-3">
          <div class="d-flex gap-2 align-items-center">
            <input id="captchaInput" class="form-control form-control-lg" type="text" th:field="*{captcha}" placeholder="Nhập mã captcha" style="flex:0 0 60%" aria-label="Mã captcha"/>
            <img id="captchaImg" th:src="@{/captcha.png}" alt="Mã captcha" class="captcha-img flex-grow-1" style="object-fit:cover"/>
            <button type="button" class="btn btn-outline-secondary" onclick="refreshCaptcha()" title="Làm mới mã captcha" aria-label="Làm mới mã captcha"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
          <div class="text-danger small" th:if="${#fields.hasErrors('captcha')}" th:errors="*{captcha}"></div>
        </div>

        <!-- Ngay sinh: 3 dropdown -->
        <div class="mb-3">
          <label class="form-label fw-bold" style="font-size:14px">Ngày sinh</label>
          <div class="row g-2">
            <div class="col-4">
              <select class="form-select" th:field="*{birthDay}" aria-label="Ngày">
                <option value="">Ngày</option>
                <option th:each="d : ${#numbers.sequence(1,31)}" th:value="${d}" th:text="${d}">1</option>
              </select>
            </div>
            <div class="col-4">
              <select class="form-select" th:field="*{birthMonth}" aria-label="Tháng">
                <option value="">Tháng</option>
                <option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}" th:text="${m}">1</option>
              </select>
            </div>
            <div class="col-4">
              <select class="form-select" th:field="*{birthYear}" aria-label="Năm">
                <option value="">Năm</option>
                <option th:each="y : ${#numbers.sequence(2026,1950,-1)}" th:value="${y}" th:text="${y}">2000</option>
              </select>
            </div>
          </div>
          <div class="text-danger small" th:if="${#fields.hasErrors('birthDay')}" th:errors="*{birthDay}"></div>
          <div class="text-danger small" th:if="${#fields.hasErrors('birthMonth')}" th:errors="*{birthMonth}"></div>
          <div class="text-danger small" th:if="${#fields.hasErrors('birthYear')}" th:errors="*{birthYear}"></div>
        </div>

        <!-- Gioi tinh -->
        <div class="mb-3">
          <label class="form-label fw-bold me-3" style="font-size:14px">Giới tính</label>
          <label class="form-check form-check-inline">
            <input class="form-check-input" type="radio" th:field="*{gender}" value="NAM"/> Nam
          </label>
          <label class="form-check form-check-inline">
            <input class="form-check-input" type="radio" th:field="*{gender}" value="NU"/> Nữ
          </label>
          <div class="text-danger small" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
        </div>

        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" th:field="*{termsAccepted}" id="termsAccepted"/>
          <label class="form-check-label" for="termsAccepted">Tôi đã đọc và đồng ý với các <em class="text-primary">điều kiện chung</em> của Luminous.</label>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" th:field="*{policyAccepted}" id="policyAccepted"/>
          <label class="form-check-label" for="policyAccepted">Tôi đồng ý với các <em class="text-primary">chính sách</em> của Luminous.</label>
        </div>
        <div class="text-danger small mb-2" th:if="${#fields.hasErrors('termsAccepted')}" th:errors="*{termsAccepted}"></div>
        <div class="text-danger small mb-2" th:if="${#fields.hasErrors('policyAccepted')}" th:errors="*{policyAccepted}"></div>

        <button class="btn btn-lum w-100 btn-lg" type="submit">Đăng ký</button>
      </form>

      <p class="text-center mt-3 mb-1">Bạn đã có tài khoản? <a th:href="@{/login}" class="fw-bold text-success text-decoration-none">ĐĂNG NHẬP NGAY</a></p>
      <div class="row g-2 mt-3">
        <div class="col-6"><button type="button" class="btn btn-facebook w-100" onclick="alert('Đăng nhập Facebook sẽ được cấu hình OAuth ở bước sau, hiện chỉ là giao diện theo Figma.')">f &nbsp;Facebook</button></div>
        <div class="col-6"><button type="button" class="btn btn-google w-100" onclick="alert('Đăng nhập Google sẽ được cấu hình OAuth ở bước sau, hiện chỉ là giao diện theo Figma.')">G &nbsp;Google</button></div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
