<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments :: head('Danh sách sản phẩm')}"></head>
<body>
<div class="admin-shell">
  <div th:replace="~{admin/fragments :: sidebar('products')}"></div>
  <div class="admin-overlay" onclick="toggleSidebar(false)"></div>
  <main class="admin-main">
    <div th:replace="~{admin/fragments :: topbar('Danh sách sản phẩm')}"></div>
    <div th:replace="~{admin/fragments :: toast}"></div>

    <form th:action="@{/admin/products}" method="get" class="admin-toolbar">
<div class="admin-search-group">
        <input type="text" name="q" class="form-control" placeholder="Tìm tên, thương hiệu, mã sản phẩm" th:value="${q}"/>
        <button type="submit" class="btn btn-soft"><i class="bi bi-search"></i> Tìm kiếm</button>
      </div>
      <select name="categoryId" class="form-select" style="width: 250px;" onchange="this.form.submit()">
        <option value="">Tất cả loại sản phẩm</option>
        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${categoryId == cat.id}">Loại</option>
      </select>
      <select name="active" class="form-select" style="width: 210px;" onchange="this.form.submit()">
        <option value="">Tất cả trạng thái</option>
        <option value="true" th:selected="${active == true}">Đang bán</option>
        <option value="false" th:selected="${active == false}">Ngừng bán</option>
      </select>
      <select name="sort" class="form-select" style="width: 200px;" onchange="this.form.submit()">
        <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
        <option value="oldest" th:selected="${sort == 'oldest'}">Cũ nhất</option>
        <option value="nameAsc" th:selected="${sort == 'nameAsc'}">Tên A - Z</option>
        <option value="nameDesc" th:selected="${sort == 'nameDesc'}">Tên Z - A</option>
      </select>
      <span class="flex-grow-1"></span>
      <a th:href="@{/admin/products}" class="btn btn-light"><i class="bi bi-arrow-counterclockwise"></i> Đặt lại</a>
      <a th:href="@{/admin/products/new}" class="btn btn-green"><i class="bi bi-plus-lg"></i> Thêm sản phẩm mới</a>
    </form>


    <div class="bulk-bar" id="bulkBar" data-bulk-url="/admin/products/bulk" hidden>
      <span>Đã chọn <strong id="bulkCount">0</strong> mục</span>
      <button type="button" class="btn btn-sm btn-danger rounded-pill" onclick="confirmBulkDelete()">Xóa đã chọn</button>
      <button type="button" class="btn btn-sm btn-soft rounded-pill" onclick="submitBulk('deactivate')">Ngừng bán</button>
      <button type="button" class="btn btn-sm btn-soft rounded-pill" onclick="submitBulk('activate')">Mở bán</button>
    </div>

    <form id="bulkForm" method="post" class="d-none">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="bulkAction" id="bulkActionInput"/>
      <input type="hidden" name="newStatus" id="bulkStatusInput"/>
    </form>

    <div class="admin-card">
      <div class="table-responsive">
        <table class="table admin-table">
          <thead>
            <tr><th style="width: 40px;"><input type="checkbox" class="form-check-input select-all" title="Chọn tất cả trên trang"/></th>
            <th>Mã</th><th>Hình ảnh</th><th>Tên sản phẩm</th><th>Loại sản phẩm</th><th>Thương hiệu</th><th class="text-end">Giá</th><th class="text-end">Đã bán</th><th>Trạng thái</th><th class="text-end">Hành động</th></tr>
          </thead>
          <tbody>
            <tr th:each="item : ${products}">
              <td><input type="checkbox" class="form-check-input row-check" th:value="${item.id}"/></td>
              <td th:text="'#' + ${item.id}">#1</td>
              <td><img th:src="${item.imageUrl}" th:alt="${item.name}" class="admin-thumb" loading="lazy" onerror="this.onerror=null;this.src='/images/placeholder.svg'"/></td>
              <td>
                <div class="admin-name" th:text="${item.name}">Tên sản phẩm</div>
                <div class="admin-sub" th:text="'Tồn kho: ' + ${item.totalStock} + ' • ' + ${item.variantCount} + ' biến thể'">Tồn kho</div>
              </td>
              <td th:text="${item.categoryName}">Loại</td>
              <td th:text="${item.brand}">Thương hiệu</td>
              <td class="text-end fw-semibold" th:text="${item.priceText()}">0đ</td>
              <td class="text-end" th:text="${item.soldCount}">0</td>
              <td>
                <span class="badge-status" th:classappend="${item.active} ? ' st-ACTIVE' : ' st-INACTIVE'"
                      th:text="${item.active} ? 'Đang bán' : 'Ngừng bán'">Đang bán</span>
              </td>
              <td>
                <div class="admin-row-actions">
                  <a th:if="${item.firstVariantId != null}" th:href="@{|/admin/orders/new?variantId=${item.firstVariantId}|}" class="admin-action-btn" title="Thêm vào đơn hàng mới"><i class="bi bi-bag-plus"></i></a>
                  <a th:href="@{|/admin/products/${item.id}/edit|}" class="admin-action-btn" title="Chỉnh sửa"><i class="bi bi-pencil"></i></a>
                  <form th:action="@{|/admin/products/${item.id}/toggle|}" method="post" class="m-0">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="admin-action-btn" th:title="${item.active} ? 'Ngừng bán' : 'Mở bán lại'">
                      <i th:class="${item.active} ? 'bi bi-pause-circle' : 'bi bi-play-circle'"></i>
                    </button>
                  </form>
                  <button type="button" class="admin-action-btn danger" title="Xóa"
                          th:data-url="|/admin/products/${item.id}/delete|"
                          th:data-message="|Xóa sản phẩm ${item.name}? Chỉ xóa được khi sản phẩm chưa có trong đơn hàng.|"
                          onclick="openConfirm(this.dataset.url, this.dataset.message)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr th:if="${products.totalElements == 0}">
              <td colspan="10"><div class="empty-state"><i class="bi bi-bag"></i>Không tìm thấy sản phẩm nào</div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div th:replace="~{admin/fragments :: pager(${products}, ${baseUrl}, ${pageQuery})}"></div>
  </main>
</div>
<div th:replace="~{admin/fragments :: confirmModal}"></div>
<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
