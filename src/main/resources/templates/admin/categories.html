<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments :: head('Loại sản phẩm')}"></head>
<body>
<div class="admin-shell">
  <div th:replace="~{admin/fragments :: sidebar('categories')}"></div>
  <div class="admin-overlay" onclick="toggleSidebar(false)"></div>
  <main class="admin-main">
    <div th:replace="~{admin/fragments :: topbar('Danh sách loại sản phẩm')}"></div>
    <div th:replace="~{admin/fragments :: toast}"></div>

    <form th:action="@{/admin/categories}" method="get" class="admin-toolbar">
<div class="admin-search-group">
        <input type="text" name="q" class="form-control" placeholder="Tìm theo tên loại sản phẩm" th:value="${q}"/>
        <button type="submit" class="btn btn-soft"><i class="bi bi-search"></i> Tìm kiếm</button>
      </div>
      <select name="status" class="form-select" style="width: 210px;" onchange="this.form.submit()">
        <option value="">Tất cả trạng thái</option>
        <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Đang bán</option>
        <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Tạm dừng</option>
      </select>
      <span class="flex-grow-1"></span>
      <a th:href="@{/admin/categories}" class="btn btn-light"><i class="bi bi-arrow-counterclockwise"></i> Đặt lại</a>
      <button type="button" class="btn btn-green" onclick="openCategoryModal('/admin/categories')">
        <i class="bi bi-plus-lg"></i> Thêm loại sản phẩm mới
      </button>
    </form>


    <div class="bulk-bar" id="bulkBar" data-bulk-url="/admin/categories/bulk" hidden>
      <span>Đã chọn <strong id="bulkCount">0</strong> mục</span>
      <button type="button" class="btn btn-sm btn-danger rounded-pill" onclick="confirmBulkDelete()">Xóa đã chọn</button>
    </div>

    <form id="bulkForm" method="post" class="d-none">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="bulkAction" id="bulkActionInput"/>
      <input type="hidden" name="newStatus" id="bulkStatusInput"/>
    </form>

    <div class="admin-card">
      <div class="table-responsive">
        <table class="table admin-table">
          <thead>
            <tr><th style="width: 40px;"><input type="checkbox" class="form-check-input select-all" title="Chọn tất cả trên trang"/></th>
            <th>Mã</th><th>Tên loại</th><th>Mô tả</th><th class="text-end">Số lượng sản phẩm</th><th>Ngày tạo</th><th>Trạng thái</th><th class="text-end">Hành động</th></tr>
          </thead>
          <tbody>
            <tr th:each="cat : ${categories}">
              <td><input type="checkbox" class="form-check-input row-check" th:value="${cat.id}"/></td>
              <td th:text="'#' + ${cat.id}">#1</td>
              <td class="admin-name" th:text="${cat.name}">Tên loại</td>
              <td class="text-muted" th:text="${cat.description}">Mô tả</td>
              <td class="text-end" th:text="${cat.productCount}">0</td>
              <td th:text="${cat.createdAt != null ? #temporals.format(cat.createdAt, 'dd/MM/yyyy') : ''}">01/01/2026</td>
              <td>
                <span class="badge-status" th:classappend="${cat.active} ? ' st-ACTIVE' : ' st-INACTIVE'"
                      th:text="${cat.active} ? 'Đang bán' : 'Tạm dừng'">Đang bán</span>
              </td>
              <td>
                <div class="admin-row-actions">
                  <button type="button" class="admin-action-btn" title="Chỉnh sửa"
                          th:data-id="${cat.id}" th:data-name="${cat.name}" th:data-description="${cat.description}" th:data-status="${cat.status}"
                          onclick="openCategoryModal('/admin/categories/' + this.dataset.id, this.dataset.id, this.dataset.name, this.dataset.description, this.dataset.status)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <form th:action="@{|/admin/categories/${cat.id}/toggle|}" method="post" class="m-0">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="admin-action-btn" th:title="${cat.active} ? 'Tạm dừng' : 'Mở bán lại'">
                      <i th:class="${cat.active} ? 'bi bi-pause-circle' : 'bi bi-play-circle'"></i>
                    </button>
                  </form>
                  <button type="button" class="admin-action-btn danger" title="Xóa"
                          th:data-url="|/admin/categories/${cat.id}/delete|"
                          th:data-message="|Xóa loại sản phẩm ${cat.name}? Chỉ xóa được khi loại này chưa có sản phẩm.|"
                          onclick="openConfirm(this.dataset.url, this.dataset.message)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr th:if="${categories.totalElements == 0}">
              <td colspan="8"><div class="empty-state"><i class="bi bi-tags"></i>Chưa có loại sản phẩm nào</div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div th:replace="~{admin/fragments :: pager(${categories}, ${baseUrl}, ${pageQuery})}"></div>
  </main>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="categoryModalTitle">Thêm loại sản phẩm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
      </div>
      <form id="categoryModalForm" th:action="${categoryModalAction ?: '/admin/categories'}" th:object="${categoryForm}" method="post">
        <div class="modal-body">
          <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="mb-3">
            <label class="form-label" for="categoryIdText">Mã loại sản phẩm</label>
            <input type="text" id="categoryIdText" class="form-control" value="Tự động" disabled/>
          </div>
          <div class="mb-3">
            <label class="form-label" for="categoryName">Tên loại sản phẩm</label>
            <input type="text" id="categoryName" class="form-control" th:field="*{name}" placeholder="Ví dụ: Sữa rửa mặt" required maxlength="100"/>
            <div class="text-danger small mt-1" id="categoryNameError" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="categoryDescription">Mô tả</label>
            <textarea id="categoryDescription" class="form-control" rows="3" th:field="*{description}" placeholder="Mô tả ngắn về loại sản phẩm này" maxlength="2000"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label" for="categoryStatus">Trạng thái</label>
            <select id="categoryStatus" class="form-select" th:field="*{status}">
              <option value="ACTIVE">Đang bán</option>
              <option value="INACTIVE">Tạm dừng</option>
            </select>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-green">Lưu</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{admin/fragments :: confirmModal}"></div>
<div th:replace="~{admin/fragments :: scripts}"></div>
<script th:inline="javascript" th:if="${showCategoryModal}">
  document.addEventListener("DOMContentLoaded", function () {
    new bootstrap.Modal(document.getElementById("categoryModal")).show();
  });
</script>
</body>
</html>
