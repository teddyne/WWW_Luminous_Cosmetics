<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='blog.css'">
<head th:replace="~{layout/header :: head(${article.title})}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="container article-detail-page">
  <nav class="detail-breadcrumb" aria-label="Breadcrumb">
    <a th:href="@{/}">Trang chủ</a><span>/</span>
    <a th:href="@{/blog}">Bài viết</a><span>/</span>
    <span th:text="${article.title}">Tiêu đề bài viết</span>
  </nav>

  <article class="article-detail">
    <span class="article-category" th:text="${article.categoryLabel()}">Chăm sóc da</span>
    <h1 th:text="${article.title}">Tiêu đề bài viết</h1>
    <div class="article-meta">
      <span><i class="bi bi-person"></i> <span th:text="${article.author}">LUMINOUS</span></span>
      <span><i class="bi bi-calendar3"></i> <span th:text="${article.publishedAt != null ? #temporals.format(article.publishedAt, 'dd/MM/yyyy HH:mm') : ''}">05/05/2026</span></span>
      <span><i class="bi bi-clock"></i> <span th:text="${article.readingMinutes} + ' phút đọc'">4 phút đọc</span></span>
    </div>
    <img class="article-cover" th:src="${article.coverImage}" th:alt="${article.title}"/>
    <p class="article-excerpt" th:text="${article.excerpt}">Mô tả ngắn của bài viết.</p>
    <div class="article-content-full" th:utext="${article.content}"></div>
    <div class="article-thank">
      <i class="bi bi-flower1"></i>
      Cảm ơn bạn đã đọc LUMINOUS Beauty Journal.
    </div>
    <a th:href="@{/blog}" class="back-button"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
  </article>

  <section class="related-articles" th:if="${!#lists.isEmpty(relatedArticles)}">
    <h2>Bài viết liên quan</h2>
    <div class="row g-4">
      <div class="col-md-4" th:each="related : ${relatedArticles}">
        <div class="article-card">
          <div class="article-image">
            <img th:src="${related.coverImage}" th:alt="${related.title}" class="article-card-img"/>
            <span class="article-category" th:text="${related.categoryLabel()}">Chăm sóc da</span>
          </div>
          <div class="article-body">
            <small><span th:text="${related.publishedAt != null ? #temporals.format(related.publishedAt, 'dd/MM/yyyy') : ''}">05/05/2026</span> • <span th:text="${related.readingMinutes} + ' phút đọc'">4 phút đọc</span></small>
            <h3 th:text="${related.title}">Tiêu đề bài viết</h3>
            <a class="read-more" th:href="@{/blog/{slug}(slug=${related.slug})}">Đọc bài viết <i class="bi bi-arrow-right"></i></a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
