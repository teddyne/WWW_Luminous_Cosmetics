<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments :: head('Tài khoản')}"></head>
<body>
<div class="admin-shell">
  <div th:replace="~{admin/fragments :: sidebar('customers')}"></div>
  <div class="admin-overlay" onclick="toggleSidebar(false)"></div>
  <main class="admin-main">
    <div th:replace="~{admin/fragments :: topbar(${formTitle})}"></div>
    <div th:replace="~{admin/fragments :: toast}"></div>

    <div class="admin-page-actions">
      <a th:href="@{/admin/customers}" class="admin-back"><i class="bi bi-arrow-left"></i> Quay lại danh sách tài khoản</a>
    </div>

    <div th:if="${formError}" class="alert alert-danger rounded-3" th:text="${formError}"></div>

    <form th:action="@{/admin/customers}" th:object="${customerForm}" method="post">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="row g-3">
        <div class="col-lg-7">
          <div class="form-card mb-3">
            <h2><span class="step-num">1</span> Thông tin tài khoản</h2>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="customerFullName">Họ tên</label>
                <input type="text" id="customerFullName" class="form-control" th:field="*{fullName}" placeholder="Ví dụ: Nguyễn Thị Mai" required maxlength="100"/>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="customerEmail">Email đăng nhập</label>
                <input type="email" id="customerEmail" class="form-control" th:field="*{email}" placeholder="vidu@gmail.com" required maxlength="100"/>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="customerPhone">Số điện thoại</label>
                <input type="text" id="customerPhone" class="form-control" th:field="*{phone}" placeholder="0900000000" maxlength="15"/>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="customerPassword">Mật khẩu</label>
                <input type="password" id="customerPassword" class="form-control" th:field="*{password}" placeholder="Từ 6 ký tự trở lên" required maxlength="100" autocomplete="new-password"/>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="customerRole">Vai trò</label>
                <select id="customerRole" class="form-select" th:field="*{roleName}">
                  <option value="ROLE_CUSTOMER">Khách hàng</option>
                  <option value="ROLE_ADMIN">Quản trị viên</option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('roleName')}" th:errors="*{roleName}"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="admin-card">
            <div class="admin-card-head"><h2 class="admin-card-title">Lưu ý</h2></div>
            <div class="admin-card-body">
              <div class="admin-sub">Tài khoản mới tạo ở trạng thái đang hoạt động, điểm tích lũy ban đầu là 0.</div>
              <div class="admin-sub mt-2">Quản trị viên đăng nhập được trang quản trị, khách hàng chỉ mua hàng trên trang shop.</div>
              <div class="admin-sub mt-2">Mật khẩu được mã hóa trước khi lưu, không ai xem lại được mật khẩu gốc.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="admin-actions-bar">
        <a th:href="@{/admin/customers}" class="btn btn-light rounded-pill px-4">Hủy</a>
        <button type="submit" class="btn btn-green">Lưu tài khoản</button>
      </div>
    </form>
  </main>
</div>
<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
