<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='account.css'">
<head th:replace="~{layout/header :: head('Kho Voucher')}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="account-page">
  <div class="container">
    <div class="account-layout">
      <div th:replace="~{account/fragments :: sidebar(active=${accountMenu})}"></div>

      <div>
        <div th:if="${voucherOk}" class="alert alert-success" th:text="${voucherOk}">Đã áp mã.</div>
        <div th:if="${voucherError}" class="alert alert-danger" th:text="${voucherError}">Lỗi.</div>

        <div class="account-card">
          <h3 class="account-title">Kho Voucher</h3>
          <p class="text-muted small">Mã giảm giá shop đang mở. Bấm "Dùng ngay" để áp mã cho đơn tiếp theo, hoặc sao chép mã rồi nhập ở trang thanh toán.</p>

          <div th:if="${#lists.isEmpty(availableVouchers)}" class="text-center text-muted py-4">
            Hiện chưa có voucher nào đang mở.
          </div>

          <div class="voucher-list">
            <article class="voucher-card" th:each="v : ${availableVouchers}">
              <div class="voucher-left">
                <span class="voucher-badge" th:text="${v.badgeLabel()}">Giảm giá</span>
                <strong class="voucher-name" th:text="${v.voucherName}">Tên voucher</strong>
                <span class="voucher-desc" th:if="${v.description != null}" th:text="${v.description}">Mô tả</span>
                <small class="text-muted">
                  <span th:text="'Đơn tối thiểu: ' + ${#numbers.formatDecimal(v.minOrderValue, 1, 'POINT', 0, 'COMMA')} + 'đ'">Đơn tối thiểu</span>
                  <span th:if="${v.endDate != null}" th:text="' · Hết hạn: ' + ${#temporals.format(v.endDate, 'dd/MM/yyyy')}">Hết hạn</span>
                </small>
              </div>
              <div class="voucher-right">
                <code class="voucher-code" th:text="${v.voucherCode}">MAVOUCHER</code>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-secondary btn-sm" type="button"
                          th:attr="data-code=${v.voucherCode}" onclick="copyVoucherCode(this)">Sao chép</button>
                  <form th:action="@{/account/vouchers/{id}/use(id=${v.id})}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-lum btn-sm" type="submit">Dùng ngay</button>
                  </form>
                </div>
              </div>
            </article>
          </div>

          <div th:if="${!#lists.isEmpty(expiredVouchers)}" class="mt-4">
            <h2 class="h6 text-muted">Đã hết hạn / hết lượt</h2>
            <div class="voucher-list expired">
              <article class="voucher-card" th:each="v : ${expiredVouchers}">
                <div class="voucher-left">
                  <span class="voucher-badge" th:text="${v.badgeLabel()}">Giảm giá</span>
                  <strong class="voucher-name" th:text="${v.voucherName}">Tên voucher</strong>
                </div>
                <div class="voucher-right">
                  <code class="voucher-code" th:text="${v.voucherCode}">MAVOUCHER</code>
                </div>
              </article>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  function copyVoucherCode(btn) {
    var code = btn.getAttribute('data-code');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(code).then(function () { btn.textContent = 'Đã sao chép'; });
    }
  }
</script>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
