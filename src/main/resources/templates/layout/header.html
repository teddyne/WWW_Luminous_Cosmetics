<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title} + ' | LUMINOUS'">LUMINOUS</title>
  <link rel="icon" th:href="@{/images/logo.png}" type="image/png"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- CSS CHUNG cho toan he thong (header/footer/nut/bien mau). -->
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
  <!-- CSS RIENG theo trang: trang nao dat th:with="pageCss='ten.css'" tren the
       <html> thi nap them file do, trang khong dat thi chi dung CSS chung.
       Vi du: trang chu pageCss='home.css', trang menu pageCss='menu.css',
       dang nhap/dang ky pageCss='auth.css'. Khong con 1 file style.css chua
       het moi trang nhu truoc. -->
  <link th:if="${pageCss != null}" rel="stylesheet" th:href="@{/css/{f}(f=${pageCss})}"/>
</head>
<body>

<!-- ================= HEADER (dung chung cho moi trang) ================= -->
<!-- Hamburger khong mo drawer nua: no dan sang trang menu rieng /menu
     (templates/menu/menu.html). Drawer cu trong file nay da duoc xoa. -->
<!-- Thu tu: hamburger trai - logo giua - icon phai (tai khoan, gio hang).
     Thanh tim kiem o header DA BO theo yeu cau moi; tim kiem chi con o
     banner trang chu (hero-search), van gui ve "/" voi tham so q. -->
<header th:fragment="header" class="site-header">
  <div class="container">
    <div class="header-row">
      <a th:href="@{/menu}" class="header-icon menu-link page-transition-link text-decoration-none" title="Menu" aria-label="Mở menu">
        <i class="bi bi-list"></i>
      </a>
      <!-- Logo LA HINH ANH (khong phai chu text don thuan) -->
      <a th:href="@{/}" class="header-logo text-decoration-none" aria-label="LUMINOUS - Trang chủ">
        <img th:src="@{/images/logo.png}" alt="LUMINOUS" class="logo-img"/>
      </a>
      <div class="d-flex align-items-center gap-2">
        <!-- Tai khoan: Guest -> Dang nhap; da dang nhap -> dropdown theo role -->
        <div th:if="${currentUser == null}">
          <a th:href="@{/login}" class="header-icon text-decoration-none" title="Tài khoản" aria-label="Tài khoản"><i class="bi bi-person"></i></a>
        </div>
        <div th:if="${currentUser != null}" class="dropdown">
          <button class="btn header-icon dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Tài khoản">
            <i class="bi bi-person-check"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><span class="dropdown-item-text fw-bold" th:text="${currentUser.fullName()}">Tên người dùng</span></li>
            <li><span class="dropdown-item-text text-muted small">
              <span th:text="${currentUser.roleName() == 'ROLE_ADMIN' ? 'Quản trị viên' : 'Khách hàng'}">Khách hàng</span>
              <span th:if="${currentUser.user.pointBalance != null}" th:text="' • ' + ${currentUser.user.pointBalance} + ' điểm'"></span>
            </span></li>
            <li><hr class="dropdown-divider"/></li>
            <li th:if="${currentUser.admin}"><a class="dropdown-item" th:href="@{/admin}">Trang quản trị</a></li>
            <li><a class="dropdown-item" th:href="@{/cart}">Giỏ hàng</a></li>
            <li>
              <form th:action="@{/logout}" method="post" class="m-0">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="dropdown-item" type="submit">Đăng xuất</button>
              </form>
            </li>
          </ul>
        </div>
        <a th:href="@{/cart}" class="header-icon text-decoration-none position-relative" title="Giỏ hàng" aria-label="Giỏ hàng">
          <i class="bi bi-cart3"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success"
                th:if="${cartCount > 0}" th:text="${cartCount > 99 ? '99+' : cartCount}">0</span>
        </a>
      </div>
    </div>
  </div>

</header>

<!-- ================= THE SAN PHAM (dung chung cho uu dai / moi / ban chay) ================= -->
<!-- Luu y: o homepage/home.html, th:each phai nam tren <th:block> rieng, khong duoc
     gop chung voi th:replace tren cung 1 the — neu gop, fragment co the nhan card = null
     va loi dung o ${card.imageUrl} (line 134 ban cu), khien trang dung giua chung. -->
<!-- Gia: gia cu gach ngang (chi khi dang giam gia) + gia uu dai mau do.
     Sao: so thap phan (vd 4.7) + icon sao + so luong danh gia, lay tu Review that.
     Hover: nen xanh la nhat (xem home.css .product-card:hover; the nay chi dung o trang chu, trang chu nap home.css). -->
<article th:fragment="productCard(card, showSale)" class="product-card">
  <a class="product-card-link product-card-image-link" th:href="@{/products/{id}(id=${card.product.id})}">
    <img th:src="${card.getImageUrl()}" th:alt="${card.name()}" loading="lazy"/>
  </a>
  <div class="p-3 d-flex flex-column flex-grow-1">
    <div class="product-brand" th:text="${card.brand()}">THƯƠNG HIỆU</div>
    <a class="product-card-link product-name" th:href="@{/products/{id}(id=${card.product.id})}" th:text="${card.name()}">Tên sản phẩm</a>
    <div class="mt-1">
      <span th:if="${card.getReviewCount() > 0}">
        <span class="rating-number" th:text="${#numbers.formatDecimal(card.getRating(), 1, 1)}">4.7</span>
        <span class="stars">★</span>
        <span class="text-muted small" th:text="'(' + ${card.getReviewCount()} + ' đánh giá)'"></span>
      </span>
      <span th:if="${card.getReviewCount() == 0}" class="text-muted small">Chưa có đánh giá</span>
    </div>
    <div class="mt-auto pt-2 d-flex align-items-end justify-content-between gap-2">
      <div class="price-block">
        <div th:if="${showSale and card.onSale()}" class="price-old" th:text="${card.priceText()}">298.000đ</div>
        <div th:class="${showSale and card.onSale() ? 'price-sale' : 'price-normal'}"
             th:text="${showSale and card.onSale() ? card.displayPriceText() : card.priceText()}">245.000đ</div>
      </div>

      <form th:action="@{/cart/add}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="variantId" th:value="${card.variant.id}"/>
        <input type="hidden" name="quantity" value="1"/>
        <button type="submit" class="btn-add-cart" title="Thêm vào giỏ hàng" aria-label="Thêm vào giỏ hàng"><i class="bi bi-cart-plus"></i></button>
      </form>
    </div>
  </div>
</article>

</body>
</html>
