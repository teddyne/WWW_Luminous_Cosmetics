<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments :: head('Sản phẩm')}"></head>
<body>
<div class="admin-shell">
  <div th:replace="~{admin/fragments :: sidebar('products')}"></div>
  <div class="admin-overlay" onclick="toggleSidebar(false)"></div>
  <main class="admin-main">
    <div th:replace="~{admin/fragments :: topbar(${formTitle})}"></div>
    <div th:replace="~{admin/fragments :: toast}"></div>

    <div class="admin-page-actions">
      <a th:href="@{/admin/products}" class="admin-back"><i class="bi bi-arrow-left"></i> Quay lại danh sách sản phẩm</a>
    </div>

    <div th:if="${formError}" class="alert alert-danger rounded-3" th:text="${formError}"></div>

    <form th:action="${formAction}" th:object="${productForm}" method="post" enctype="multipart/form-data">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="row g-3">
        <div class="col-lg-7">
          <div class="form-card mb-3">
            <h2><span class="step-num">1</span> Thông tin sản phẩm</h2>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="productName">Tên sản phẩm</label>
                <input type="text" id="productName" class="form-control" th:field="*{name}" placeholder="Ví dụ: Sữa rửa mặt CeraVe" required maxlength="200"/>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="productCategory">Loại sản phẩm</label>
                <select id="productCategory" class="form-select" th:field="*{categoryId}" required>
                  <option value="">Chọn loại sản phẩm</option>
                  <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Loại</option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="productBrand">Thương hiệu</label>
                <input type="text" id="productBrand" class="form-control" th:field="*{brand}" placeholder="Ví dụ: CERAVE" maxlength="100"/>
              </div>
              <div class="col-12">
                <label class="form-label" for="productDescription">Mô tả chi tiết</label>
                <textarea id="productDescription" class="form-control" rows="6" th:field="*{description}" placeholder="Mô tả công dụng, thành phần, ưu điểm... (soạn văn bản, chèn ảnh như bài viết)"></textarea>
              </div>
              <div class="col-12">
                <label class="form-label" for="productUsage">Hướng dẫn sử dụng</label>
                <textarea id="productUsage" class="form-control" rows="3" th:field="*{usageInstructions}" placeholder="Ví dụ: Lấy một lượng vừa đủ, tạo bọt với nước rồi massage nhẹ nhàng lên mặt, rửa sạch với nước. Dùng 2 lần mỗi ngày."></textarea>
              </div>
            </div>
          </div>

          <div class="form-card mb-3">
            <h2><span class="step-num">2</span> Biến thể (dung tích / màu sắc)</h2>
            <div id="variantRows">
              <div class="variant-row" th:each="v, stat : ${productForm.variants}">
                <input type="hidden" th:field="*{variants[__${stat.index}__].id}"/>
                <div class="row g-2">
                  <div class="col-md-3">
                    <label class="form-label">Mã SKU</label>
                    <input type="text" class="form-control" th:field="*{variants[__${stat.index}__].sku}" placeholder="Để trống để tự tạo" maxlength="50"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Dung tích</label>
                    <input type="text" class="form-control" th:field="*{variants[__${stat.index}__].size}" placeholder="Ví dụ: 473ml" maxlength="50"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Tên màu</label>
                    <input type="text" class="form-control" th:field="*{variants[__${stat.index}__].shadeName}" placeholder="Dành cho son, phấn..." maxlength="100"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Mã màu</label>
                    <div class="input-group">
                      <input type="text" class="form-control variant-hex" th:field="*{variants[__${stat.index}__].hexCode}" placeholder="#FF0000" maxlength="10"/>
                      <input type="color" class="form-control form-control-color variant-hex-picker" value="#FF0000" title="Chọn màu"/>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Giá bán (đ)</label>
                    <input type="text" inputmode="numeric" class="form-control money-input" th:field="*{variants[__${stat.index}__].price}" placeholder="Ví dụ: 300,000" required/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('variants[' + stat.index + '].price')}" th:errors="*{variants[__${stat.index}__].price}"></div>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Giá khuyến mãi (đ)</label>
                    <input type="text" inputmode="numeric" class="form-control money-input" th:field="*{variants[__${stat.index}__].salePrice}" placeholder="Để trống nếu không giảm"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Tồn kho</label>
                    <input type="number" class="form-control" th:field="*{variants[__${stat.index}__].stockQuantity}" min="0" step="1" required/>
                  </div>
                  <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-danger w-100 variant-remove" title="Xóa biến thể này"><i class="bi bi-trash"></i></button>
                  </div>
                </div>
              </div>
            </div>
            <button type="button" class="btn btn-soft mt-2" id="addVariantBtn"><i class="bi bi-plus-lg"></i> Thêm biến thể</button>
            <template id="variantRowTemplate">
              <div class="variant-row">
                <input type="hidden" name="variants[__INDEX__].id" value=""/>
                <div class="row g-2">
                  <div class="col-md-3">
                    <label class="form-label">Mã SKU</label>
                    <input type="text" class="form-control" name="variants[__INDEX__].sku" placeholder="Để trống để tự tạo" maxlength="50"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Dung tích</label>
                    <input type="text" class="form-control" name="variants[__INDEX__].size" placeholder="Ví dụ: 473ml" maxlength="50"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Tên màu</label>
                    <input type="text" class="form-control" name="variants[__INDEX__].shadeName" placeholder="Dành cho son, phấn..." maxlength="100"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Mã màu</label>
                    <div class="input-group">
                      <input type="text" class="form-control variant-hex" name="variants[__INDEX__].hexCode" placeholder="#FF0000" maxlength="10"/>
                      <input type="color" class="form-control form-control-color variant-hex-picker" value="#FF0000" title="Chọn màu"/>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Giá bán (đ)</label>
                    <input type="text" inputmode="numeric" class="form-control money-input" name="variants[__INDEX__].price" placeholder="Ví dụ: 300,000" required/>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Giá khuyến mãi (đ)</label>
                    <input type="text" inputmode="numeric" class="form-control money-input" name="variants[__INDEX__].salePrice" placeholder="Để trống nếu không giảm"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Tồn kho</label>
                    <input type="number" class="form-control" name="variants[__INDEX__].stockQuantity" min="0" step="1" value="0" required/>
                  </div>
                  <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-danger w-100 variant-remove" title="Xóa biến thể này"><i class="bi bi-trash"></i></button>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <div class="form-card mb-3">
            <h2><span class="step-num">3</span> Thông số sản phẩm</h2>
            <div id="attributeRows">
              <div class="attribute-row" th:each="a, stat : ${productForm.attributes}">
                <div class="row g-2">
                  <div class="col-md-5">
                    <input type="text" class="form-control" th:field="*{attributes[__${stat.index}__].name}" placeholder="Tên thông số (ví dụ: Barcode)" maxlength="100"/>
                  </div>
                  <div class="col-md-6">
                    <input type="text" class="form-control" th:field="*{attributes[__${stat.index}__].value}" maxlength="500"/>
                  </div>
                  <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-danger w-100 attribute-remove" title="Xóa thông số"><i class="bi bi-trash"></i></button>
                  </div>
                </div>
              </div>
            </div>
            <button type="button" class="btn btn-soft mt-2" id="addAttributeBtn"><i class="bi bi-plus-lg"></i> Thêm thông số</button>
            <template id="attributeRowTemplate">
              <div class="attribute-row">
                <div class="row g-2">
                  <div class="col-md-5">
                    <input type="text" class="form-control" name="attributes[__INDEX__].name" placeholder="Tên thông số (ví dụ: Barcode)" maxlength="100"/>
                  </div>
                  <div class="col-md-6">
                    <input type="text" class="form-control" name="attributes[__INDEX__].value" placeholder="Giá trị (ví dụ: 3337875597357)" maxlength="500"/>
                  </div>
                  <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-danger w-100 attribute-remove" title="Xóa thông số"><i class="bi bi-trash"></i></button>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <div class="form-card">
            <h2><span class="step-num">4</span> Thành phần và da phù hợp</h2>
            <div class="mb-3">
              <label class="form-label" for="productIngredients">Thành phần</label>
              <textarea id="productIngredients" class="form-control" rows="3" th:field="*{ingredients}" placeholder="Liệt kê thành phần chính, cách nhau bằng dấu phẩy"></textarea>
            </div>
            <label class="form-label">Da phù hợp</label>
            <div class="d-flex flex-wrap gap-3">
              <div class="form-check" th:each="skin : ${skinTypes}">
                <input class="form-check-input" type="checkbox" th:id="'skin-' + ${skin.code}" th:field="*{suitableSkinTypes}" th:value="${skin.code}"/>
                <label class="form-check-label" th:for="'skin-' + ${skin.code}" th:text="${skin.label}">Da dầu</label>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="form-card">
            <h2><span class="step-num">5</span> Hình ảnh và video sản phẩm</h2>
            <label class="upload-box" for="productImage">
              <i class="bi bi-cloud-arrow-up"></i>
              <span>Tải lên ảnh chính</span>
              <input type="file" id="productImage" name="image" accept="image/*" class="d-none" data-preview="productImagePreview"/>
            </label>
            <img id="productImagePreview" class="upload-preview d-none" alt="Ảnh chính"
                 th:src="${productForm.imageUrl}" th:class="${productForm.imageUrl != null and productForm.imageUrl != ''} ? 'upload-preview' : 'upload-preview d-none'"
                 onerror="this.onerror=null;this.src='/images/placeholder.svg'"/>
            <div class="mt-3">
              <label class="form-label" for="productImageUrl">Hoặc dán đường dẫn ảnh</label>
              <input type="text" id="productImageUrl" class="form-control" th:field="*{imageUrl}" placeholder="https://... hoặc /products/..." maxlength="500"/>
            </div>
            <div class="mt-3">
              <label class="form-label" for="productImages">Thêm nhiều ảnh sản phẩm (chọn nhiều ảnh cùng lúc)</label>
              <input type="file" id="productImages" name="images" accept="image/*" class="form-control" multiple/>
            </div>
            <div class="mt-3">
              <label class="form-label" for="productVideoFile">Video sản phẩm (mp4, webm hoặc mov, tối đa 50MB)</label>
              <input type="file" id="productVideoFile" name="video" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" class="form-control"/>
            </div>
            <div class="mt-3">
              <label class="form-label" for="productVideo">Hoặc dán đường dẫn video</label>
              <input type="text" id="productVideo" class="form-control" th:field="*{videoUrl}" placeholder="https://... hoặc /products/..." maxlength="500"/>
            </div>
          </div>
        </div>
      </div>

      <div class="admin-actions-bar">
        <a th:href="@{/admin/products}" class="btn btn-light rounded-pill px-4">Hủy</a>
        <button type="submit" name="action" value="draft" class="btn btn-soft">Lưu bản nháp</button>
        <button type="submit" name="action" value="publish" class="btn btn-green">Lưu &amp; đăng</button>
      </div>
    </form>
  </main>
</div>
<div th:replace="~{admin/fragments :: scripts}"></div>
<script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.4/tinymce.min.js"></script>
<script>
  // Mo ta san pham dang rich text (TinyMCE): in dam, danh sach, bang, chen anh.
  // Anh chen trong mo ta tai len qua /admin/products/upload-image, luu o /uploads/editor/.
  (function () {
    var editor = document.getElementById('productDescription');
    if (!editor || typeof tinymce === 'undefined') return;
    tinymce.init({
      selector: '#productDescription',
      height: 380,
      menubar: false,
      plugins: 'lists link image table code',
      toolbar: 'undo redo | bold italic underline | bullist numlist | link image table | removeformat code',
      images_upload_handler: function (blobInfo) {
        return new Promise(function (resolve, reject) {
          var formData = new FormData();
          formData.append('file', blobInfo.blob(), blobInfo.filename());
          var token = document.querySelector('input[name="_csrf"]');
          if (token) formData.append('_csrf', token.value);
          fetch('/admin/products/upload-image', { method: 'POST', body: formData })
            .then(function (r) {
              return r.json().then(function (data) {
                if (!r.ok) throw new Error(data.error || 'Tải ảnh thất bại');
                resolve(data.location);
              });
            })
            .catch(function (e) { reject(e.message || 'Tải ảnh thất bại'); });
        });
      },
      content_style: 'img { max-width: 100%; height: auto; } body { font-family: "Be Vietnam Pro", sans-serif; font-size: 14px; line-height: 1.7; }'
    });
  })();

  // Bien the dong: them/xoa dong, dong bo o chon mau, danh lai chi so sau khi xoa.
  (function () {
    var list = document.getElementById('variantRows');
    var template = document.getElementById('variantRowTemplate');
    if (!list || !template) return;
    var reindexVariants = function () {
      list.querySelectorAll('.variant-row').forEach(function (row, i) {
        row.querySelectorAll('input, select, textarea').forEach(function (input) {
          if (input.name) input.name = input.name.replace(/variants\[\d+\]/, 'variants[' + i + ']');
        });
      });
    };
    var refreshRemoveButtons = function () {
      var rows = list.querySelectorAll('.variant-row');
      rows.forEach(function (row) {
        var btn = row.querySelector('.variant-remove');
        if (btn) btn.style.display = rows.length > 1 ? '' : 'none';
      });
    };
    var bindHexPicker = function (row) {
      var picker = row.querySelector('.variant-hex-picker');
      var text = row.querySelector('.variant-hex');
      if (!picker || !text) return;
      picker.addEventListener('input', function () { text.value = picker.value.toUpperCase(); });
      if (text.value && /^#[0-9A-Fa-f]{6}$/.test(text.value)) picker.value = text.value;
    };
    document.getElementById('addVariantBtn')?.addEventListener('click', function () {
      var html = template.innerHTML.replaceAll('__INDEX__', String(list.querySelectorAll('.variant-row').length));
      var wrapper = document.createElement('div');
      wrapper.innerHTML = html.trim();
      var row = wrapper.firstElementChild;
      list.appendChild(row);
      bindHexPicker(row);
      row.querySelectorAll('.money-input').forEach(function (input) {
        if (typeof attachMoneyInput === 'function') attachMoneyInput(input);
      });
      reindexVariants();
      refreshRemoveButtons();
    });
    list.addEventListener('click', function (event) {
      var btn = event.target.closest('.variant-remove');
      if (!btn) return;
      if (list.querySelectorAll('.variant-row').length <= 1) return;
      btn.closest('.variant-row').remove();
      reindexVariants();
      refreshRemoveButtons();
    });
    list.querySelectorAll('.variant-row').forEach(bindHexPicker);
    refreshRemoveButtons();
  })();

  // Thong so san pham dong: them/xoa dong.
  (function () {
    var list = document.getElementById('attributeRows');
    var template = document.getElementById('attributeRowTemplate');
    if (!list || !template) return;
    document.getElementById('addAttributeBtn')?.addEventListener('click', function () {
      var html = template.innerHTML.replaceAll('__INDEX__', String(list.querySelectorAll('.attribute-row').length));
      var wrapper = document.createElement('div');
      wrapper.innerHTML = html.trim();
      list.appendChild(wrapper.firstElementChild);
    });
    list.addEventListener('click', function (event) {
      var btn = event.target.closest('.attribute-remove');
      if (!btn) return;
      btn.closest('.attribute-row').remove();
    });
  })();
</script>
</body>
</html>
