<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='checkout.css'">
<head th:replace="~{layout/header :: head('Đặt hàng thành công')}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="container checkout-page">
  <div th:if="${order == null}" class="success-box">
    <h1>Không tìm thấy đơn hàng</h1>
    <p th:text="${message}"></p>
    <div class="success-actions">
      <a th:href="@{/products}" class="btn-place">Tiếp tục mua hàng</a>
    </div>
  </div>

  <div th:if="${order != null}" class="success-box">
    <div class="success-icon" th:text="${paid} ? '✓' : '◷'"></div>
    <h1 th:text="${paid} ? 'Đặt hàng thành công!' : 'Đơn hàng đã được tạo!'"></h1>
    <p th:if="${message != null}" th:text="${message}"></p>
    <p th:if="${message == null}" th:text="${paid} ? 'Đơn hàng của bạn đã được thanh toán.' : 'Đơn hàng của bạn đang chờ thanh toán.'"></p>

    <button type="button" class="btn-checkout-secondary success-toggle" id="toggle-order-details" aria-expanded="false" aria-controls="order-details">Xem chi tiết đơn hàng</button>

    <div id="order-details" hidden>
    <div class="success-meta">
      <div><span>Mã đơn hàng</span><strong th:text="${order.orderCode}"></strong></div>
      <div><span>Ngày đặt</span><span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span></div>
      <div><span>Người nhận</span><span th:text="${order.recipientName} + ' • ' + ${order.recipientPhone}"></span></div>
      <div><span>Địa chỉ giao</span><span th:text="${order.shippingAddress}"></span></div>
      <div th:if="${order.note != null}"><span>Ghi chú</span><span th:text="${order.note}"></span></div>
      <div><span>Trạng thái đơn</span><span th:text="${order.status.label()}"></span></div>
      <div th:if="${payment != null}"><span>Thanh toán</span><span th:text="${payment.paymentMethod.label()} + ' • ' + ${payment.paymentStatus.label()}"></span></div>
      <div th:if="${payment != null && payment.transactionCode != null}"><span>Mã giao dịch</span><span th:text="${payment.transactionCode}"></span></div>
    </div>

    <div class="success-items">
      <div class="success-item" th:each="d : ${details}">
        <div>
          <div class="summary-item-name" th:text="${d.variant.product.name}"></div>
          <div class="summary-item-meta" th:text="${d.variant.size} + ' × ' + ${d.quantity}"></div>
        </div>
        <div th:text="${#numbers.formatInteger(d.totalPrice, 1, 'POINT')} + 'đ'"></div>
      </div>
    </div>

    <div class="summary-row"><span>Tạm tính</span><span th:text="${#numbers.formatInteger(order.subtotal, 1, 'POINT')} + 'đ'"></span></div>
    <div class="summary-row"><span>Giảm giá</span><span th:text="'-' + ${#numbers.formatInteger(order.discountAmount, 1, 'POINT')} + 'đ'"></span></div>
    <div class="summary-row"><span>Phí vận chuyển</span><span th:text="${#numbers.formatInteger(order.shippingFee, 1, 'POINT')} + 'đ'"></span></div>
    <div class="summary-row"><span>Điểm đã dùng</span><span th:text="'-' + ${order.usedPoints} + 'đ'"></span></div>
    <div class="summary-total"><span>Tổng cộng</span><span th:text="${#numbers.formatInteger(order.totalAmount, 1, 'POINT')} + 'đ'"></span></div>
    </div>

    <div class="success-actions">
      <a th:href="@{/products}" class="btn-place">Tiếp tục mua hàng</a>
      <a th:href="@{/}" class="btn-checkout-secondary">Về trang chủ</a>
    </div>
  </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<script>
  // An/hien chi tiet don hang (mac dinh chi hien tieu de + nut xem chi tiet).
  (function () {
    var btn = document.getElementById('toggle-order-details');
    var details = document.getElementById('order-details');
    if (!btn || !details) return;
    btn.addEventListener('click', function () {
      var open = details.hidden;
      details.hidden = !open;
      btn.textContent = open ? 'Ẩn chi tiết đơn hàng' : 'Xem chi tiết đơn hàng';
      btn.setAttribute('aria-expanded', String(open));
    });
  })();
</script>
</body>
</html>
