<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='account.css'">
<head th:replace="~{layout/header :: head('Thông Báo')}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="account-page">
  <div class="container">
    <div class="account-layout">
      <div th:replace="~{account/fragments :: sidebar(active=${accountMenu})}"></div>

      <div>
        <div class="account-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="account-title mb-0">Thông Báo</h3>
            <form th:if="${unread > 0}" th:action="@{/account/notifications/read-all}" method="post" class="m-0">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button class="btn btn-outline-secondary btn-sm" type="submit">Đánh dấu tất cả đã đọc</button>
            </form>
          </div>

          <div th:if="${#lists.isEmpty(notificationList)}" class="text-center text-muted py-4">
            Bạn chưa có thông báo nào.
          </div>

          <div class="notif-list">
            <a th:each="n : ${notificationList}"
               th:href="@{/account/notifications/{id}/open(id=${n.id})}"
               class="notif-item text-decoration-none"
               th:classappend="${!n.isRead} ? ' unread'">
              <span class="notif-icon" th:switch="${n.type}">
                <i th:case="'POINTS'" class="bi bi-coin"></i>
                <i th:case="'REVIEW'" class="bi bi-star"></i>
                <i th:case="'RETURN'" class="bi bi-arrow-counterclockwise"></i>
                <i th:case="*" class="bi bi-bag"></i>
              </span>
              <span class="notif-body">
                <strong th:text="${n.title}">Tiêu đề</strong>
                <span class="notif-message" th:if="${n.message != null}" th:text="${n.message}">Nội dung</span>
                <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}">thời gian</small>
              </span>
              <span class="notif-dot" th:if="${!n.isRead}" title="Chưa đọc"></span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
