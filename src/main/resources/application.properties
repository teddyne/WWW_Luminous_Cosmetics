spring.application.name=luminous
server.port=8080

# --- MariaDB (file SQL goc tao DB LUMINOUS_DB) ---
spring.datasource.url=jdbc:mariadb://localhost:3307/LUMINOUS_DB?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA: KHONG tu sua DB. Schema phai khop file SQL + migration ---
# validate = neu ten bang/cot sai, app bao loi ngay khi khoi dong thay vi chay sai am tham.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# QUAN TRONG - SUA LOI "missing column [avt_url]":
# DB luminous_db.sql dung ten cot camelCase (avtUrl, fullName, userID, salePrice...),
# nhung mac dinh Spring Boot dung SpringPhysicalNamingStrategy, tu doi camelCase
# thanh snake_case (avtUrl -> avt_url, fullName -> full_name...) khi tao ten cot that.
# Vi vay Hibernate di tim cot avt_url khong ton tai, du entity da ghi dung @Column(name="avtUrl").
# Chuyen sang strategy chuan de giu nguyen dung ten cot nhu trong @Column / file SQL.
# Day la sua tong, ap dung cho TAT CA bang/cot camelCase, khong can sua tung entity.
# TUYET DOI KHONG doi ddl-auto thanh update de "chua" loi nay: Hibernate se tao them
# cac cot snake_case moi (avt_url, full_name...) ben canh cot cu, lam lech du lieu mau.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
# Khong khai bao dialect thu cong nua: Hibernate 7 tu nhan MariaDBDialect theo DB that,
# khai bao tay chi sinh warning "MariaDBDialect does not need to be specified explicitly".

# --- Thymeleaf: dev thi tat cache de sua template thay ngay, khi chay that thi bat lai ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- Upload anh (giai doan sau: admin them san pham) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

