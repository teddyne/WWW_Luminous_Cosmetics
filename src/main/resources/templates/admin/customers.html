<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments :: head('Khách hàng')}"></head>
<body>
<div class="admin-shell">
  <div th:replace="~{admin/fragments :: sidebar(${activeMenu})}"></div>
  <div class="admin-overlay" onclick="toggleSidebar(false)"></div>
  <main class="admin-main">
    <div th:replace="~{admin/fragments :: topbar(${role == 'ROLE_ADMIN'} ? 'Quản trị viên' : 'Danh sách khách hàng')}"></div>
    <div th:replace="~{admin/fragments :: toast}"></div>

    <form th:action="@{/admin/customers}" method="get" class="admin-toolbar">
<div class="admin-search-group">
        <input type="text" name="q" class="form-control" placeholder="Tìm tên, email, số điện thoại" th:value="${q}"/>
        <button type="submit" class="btn btn-soft"><i class="bi bi-search"></i> Tìm kiếm</button>
      </div>
      <select name="sort" class="form-select" style="width: 200px;" onchange="this.form.submit()">
        <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
        <option value="oldest" th:selected="${sort == 'oldest'}">Cũ nhất</option>
        <option value="spentDesc" th:selected="${sort == 'spentDesc'}">Chi tiêu cao nhất</option>
        <option value="spentAsc" th:selected="${sort == 'spentAsc'}">Chi tiêu thấp nhất</option>
        <option value="ordersDesc" th:selected="${sort == 'ordersDesc'}">Nhiều đơn nhất</option>
        <option value="ordersAsc" th:selected="${sort == 'ordersAsc'}">Ít đơn nhất</option>
      </select>
      <div th:if="${role != 'ROLE_ADMIN'}" class="d-flex align-items-center gap-1">
        <label class="form-label mb-0 text-nowrap small text-muted" for="minSpent">Chi tiêu từ</label>
        <input type="text" inputmode="numeric" id="minSpent" name="minSpent" class="form-control money-input" style="width: 150px;" th:value="${minSpent}" placeholder="0đ"/>
      </div>
      <div th:if="${role != 'ROLE_ADMIN'}" class="d-flex align-items-center gap-1">
        <label class="form-label mb-0 text-nowrap small text-muted" for="minOrders">Số đơn từ</label>
        <input type="number" id="minOrders" name="minOrders" class="form-control" style="width: 100px;" min="0" th:value="${minOrders}" placeholder="0"/>
      </div>
      <span class="flex-grow-1"></span>
      <a th:href="@{/admin/customers(role=${role})}" class="btn btn-light"><i class="bi bi-arrow-counterclockwise"></i> Đặt lại</a>
      <a th:if="${role != 'ROLE_ADMIN'}" th:href="@{/admin/customers/new(role='ROLE_CUSTOMER')}" class="btn btn-green"><i class="bi bi-plus-lg"></i> Thêm khách hàng</a>
      <a th:if="${role == 'ROLE_ADMIN'}" th:href="@{/admin/customers/new(role='ROLE_ADMIN')}" class="btn btn-soft"><i class="bi bi-plus-lg"></i> Thêm quản trị viên</a>
    </form>


    <div class="bulk-bar" id="bulkBar" data-bulk-url="/admin/customers/bulk" hidden>
      <span>Đã chọn <strong id="bulkCount">0</strong> mục</span>
      <button type="button" class="btn btn-sm btn-soft rounded-pill" onclick="submitBulk('lock')">Khóa</button>
      <button type="button" class="btn btn-sm btn-soft rounded-pill" onclick="submitBulk('unlock')">Mở khóa</button>
    </div>

    <form id="bulkForm" method="post" class="d-none">
      <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="bulkAction" id="bulkActionInput"/>
      <input type="hidden" name="newStatus" id="bulkStatusInput"/>
    </form>

    <div class="admin-card">
      <div class="table-responsive">
        <table class="table admin-table">
          <thead>
            <tr><th style="width: 40px;"><input type="checkbox" class="form-check-input select-all" title="Chọn tất cả trên trang"/></th>
            <th>Khách hàng</th><th>Email</th><th>Số điện thoại</th><th class="text-end">Điểm</th><th class="text-end">Đơn hàng</th><th class="text-end">Đã chi tiêu</th><th>Vai trò</th><th>Trạng thái</th><th class="text-end">Hành động</th></tr>
          </thead>
          <tbody>
            <tr th:each="item : ${customers}">
              <td><input type="checkbox" class="form-check-input row-check" th:value="${item.id}"/></td>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <span class="admin-avatar" style="width: 36px; height: 36px; flex-basis: 36px; font-size: 14px;" th:text="${#strings.substring(item.fullName, 0, 1)}">A</span>
                  <div>
                    <div class="admin-name" th:text="${item.fullName}">Tên</div>
                    <div class="admin-sub" th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'dd/MM/yyyy') : ''}">01/01/2026</div>
                  </div>
                </div>
              </td>
              <td th:text="${item.email}">email</td>
              <td th:text="${item.phone}">0900000000</td>
              <td class="text-end" th:text="${item.pointBalance}">0</td>
              <td class="text-end" th:text="${item.orderCount}">0</td>
              <td class="text-end fw-semibold" th:text="${item.totalSpentText()}">0đ</td>
              <td>
                <span class="badge-status" th:classappend="${item.admin} ? ' st-CONFIRMED' : ' st-ACTIVE'"
                      th:text="${item.admin} ? 'Quản trị viên' : 'Khách hàng'">Khách hàng</span>
              </td>
              <td>
                <span class="badge-status" th:classappend="${item.active} ? ' st-ACTIVE' : ' st-INACTIVE'"
                      th:text="${item.active} ? 'Đang hoạt động' : 'Đã khóa'">Đang hoạt động</span>
              </td>
              <td>
                <div class="admin-row-actions">
                  <a th:href="@{|/admin/customers/${item.id}|}" class="admin-action-btn" title="Xem chi tiết"><i class="bi bi-eye"></i></a>
                </div>
              </td>
            </tr>
            <tr th:if="${customers.totalElements == 0}">
              <td colspan="10"><div class="empty-state"><i class="bi bi-people"></i>Không tìm thấy tài khoản nào</div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div th:replace="~{admin/fragments :: pager(${customers}, ${baseUrl}, ${pageQuery})}"></div>
  </main>
</div>
<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
