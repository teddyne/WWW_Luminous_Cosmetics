<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='account.css'">
<head th:replace="~{layout/header :: head('Đổi Mật Khẩu')}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<main class="account-page">
  <div class="container">
    <div class="account-layout">
      <div th:replace="~{account/fragments :: sidebar(active=${accountMenu})}"></div>

      <div>
        <section class="account-card" style="max-width:560px">
          <h2>Đổi mật khẩu</h2>
          <p class="account-subtitle">Mật khẩu mới phải có ít nhất 8 ký tự.</p>
          <div th:if="${changed}" class="alert alert-success">Đã đổi mật khẩu thành công.</div>

          <form th:action="@{/account/change-password}" th:object="${passwordForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3 position-relative">
              <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
              <input id="currentPassword" class="form-control pe-5" type="password" th:field="*{currentPassword}"/>
              <button type="button" class="btn position-absolute end-0 text-muted"
                      style="top:38px" onclick="togglePassword('currentPassword', this)" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button>
              <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
            </div>
            <div class="mb-3 position-relative">
              <label class="form-label" for="newPassword">Mật khẩu mới</label>
              <input id="newPassword" class="form-control pe-5" type="password" th:field="*{newPassword}"/>
              <button type="button" class="btn position-absolute end-0 text-muted"
                      style="top:38px" onclick="togglePassword('newPassword', this)" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button>
              <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>
            <div class="mb-3 position-relative">
              <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
              <input id="confirmPassword" class="form-control pe-5" type="password" th:field="*{confirmPassword}"/>
              <button type="button" class="btn position-absolute end-0 text-muted"
                      style="top:38px" onclick="togglePassword('confirmPassword', this)" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button>
              <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
            <button class="btn btn-lum w-100 btn-lg" type="submit">Đổi mật khẩu</button>
          </form>
        </section>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
