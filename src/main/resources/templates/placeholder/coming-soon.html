<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/header :: head(${title})}"></head>
<body>
<div th:replace="~{layout/header :: header}"></div>
<main class="container py-5" style="max-width:720px">
  <div class="card p-5 text-center">
    <div class="fs-1 mb-2"><i class="bi bi-tools"></i></div>
    <h1 class="section-title" th:text="${title}">Sắp có</h1>
    <p class="text-muted" th:text="${message}">Chức năng này sẽ được làm ở bước tiếp theo.</p>
    <div class="d-flex gap-2 justify-content-center">
      <a th:href="@{/}" class="btn btn-lum">Về trang chủ</a>
      <a th:if="${currentUser == null}" th:href="@{/login}" class="btn btn-outline-lum">Đăng nhập</a>
    </div>
  </div>
</main>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
