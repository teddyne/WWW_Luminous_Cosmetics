<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" th:with="pageCss='menu.css'">
<head th:replace="~{layout/header :: head('Menu')}"></head>
<body>
<main class="menu-page" id="menuPage">
  <div class="menu-page-left-wrap">
    <nav class="menu-page-left" aria-label="Menu chính">
      <div class="menu-list">
        <a th:href="@{/}" class="menu-item"><i class="bi bi-house"></i><span>Trang chủ</span></a>
        <button type="button" class="menu-item menu-item-product" id="menuProductBtn" onclick="toggleProductFilter()" aria-expanded="false" aria-controls="menuFilter">
          <i class="bi bi-bag"></i><span>Sản phẩm</span>
        </button>
        <a th:href="@{/cart}" class="menu-item"><i class="bi bi-cart3"></i><span>Giỏ hàng</span></a>
        <a th:href="@{/about}" class="menu-item"><i class="bi bi-people"></i><span>Giới thiệu</span></a>
        <a th:href="@{/blog}" class="menu-item"><i class="bi bi-journal-text"></i><span>Bài viết</span></a>
        <a th:href="@{/contact}" class="menu-item"><i class="bi bi-telephone"></i><span>Liên hệ</span></a>
        <a th:href="@{/support}" class="menu-item"><i class="bi bi-headset"></i><span>Hỗ trợ</span></a>
      </div>
    </nav>

    <div class="menu-page-filter" id="menuFilter" aria-label="Bộ lọc sản phẩm">
      <div class="menu-page-filter-inner">
        <a th:href="@{/products}">Xem tất cả sản phẩm</a>
        <a th:href="@{/products(sort='newest')}">Mới</a>
        <a th:href="@{/products(sort='best')}">Bán chạy</a>
        <a th:href="@{/products(categoryName='Chăm sóc da')}">Chăm sóc da</a>
        <a th:href="@{/products(categoryName='Makeup')}">Makeup</a>
        <a th:href="@{/products(categoryName='Dưỡng môi')}">Dưỡng môi</a>
      </div>
    </div>
  </div>

  <div class="menu-page-visual">
    <a th:href="@{/}" class="menu-page-close page-transition-link" aria-label="Đóng menu">✕</a>
    <img th:src="@{/images/banner/menu-visual.jpg}" alt="Mỹ phẩm LUMINOUS"/>
    <div class="menu-page-visual-overlay">
      <img th:src="@{/images/logo.png}" alt="LUMINOUS" class="logo-img"/>
      <div class="d-flex gap-3 mt-3">
        <a href="https://www.tiktok.com" target="_blank" rel="noopener" class="menu-social" title="TikTok"><i class="bi bi-music-note-beamed"></i></a>
        <a href="https://www.instagram.com" target="_blank" rel="noopener" class="menu-social" title="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="https://www.facebook.com" target="_blank" rel="noopener" class="menu-social" title="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="https://zalo.me" target="_blank" rel="noopener" class="menu-social" title="Zalo"><i class="bi bi-chat-dots"></i></a>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
